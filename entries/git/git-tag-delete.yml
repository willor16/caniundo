id: git-tag-delete
tool: git
example: git tag -d v1.0
title:
  en: Delete a tag
  es: Borrar una etiqueta
match:
  - run: git tag
    with: [-d|--delete]
verdict: "yes"
loses:
  en: The name. The commit stays, and so does the text of an annotated tag.
  es: El nombre. El commit queda, y también el texto de una etiqueta anotada.
recover:
  - id: annotated
    gives:
      en: An annotated tag, with its message. Git prints the hash when it deletes it, and the first command also lists it.
      es: Una etiqueta anotada, con su mensaje. Git muestra el hash al borrarla, y el primer comando también lo lista.
    run:
      - git fsck --no-reflogs
      - git tag <name> <hash>
    until:
      en: Until git cleans up, 2 weeks by default.
      es: Hasta que git haga limpieza, 2 semanas por defecto.
  - id: lightweight
    gives:
      en: A simple tag, which is only a name for a commit.
      es: Una etiqueta simple, que solo es un nombre para un commit.
    run: [git tag <name> <commit>]
sources:
  - https://git-scm.com/docs/git-gc
checked: 2026-11-25
proof:
  lab: git
  cases:
    - shows: restored
      recipe: annotated
      setup: |
        git init -q
        echo one > a.txt; git add a.txt; git commit -qm one
        git tag -a v1 -m notes
      run: git tag -d v1
      check: git for-each-ref --format='%(contents:subject) %(objecttype)' refs/tags/v1 | grep -qx 'notes tag'
      fill:
        name: v1
        hash: $(git fsck --no-reflogs 2>/dev/null | awk '/dangling tag/{print $3}')
    - shows: restored
      recipe: lightweight
      setup: |
        git init -q
        echo one > a.txt; git add a.txt; git commit -qm one
        git tag v1
      run: git tag -d v1
      check: test "$(git rev-parse -q --verify refs/tags/v1)" = "$(git rev-parse HEAD)"
      fill: { name: v1, commit: HEAD }

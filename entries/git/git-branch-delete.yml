id: git-branch-delete
tool: git
example: git branch -D feature
title:
  en: Delete a branch
  es: Borrar una rama
match:
  - run: git branch
    with: [-D|-d|--delete]
verdict: "yes"
loses:
  en: The name of the branch and its settings. The commits stay.
  es: El nombre de la rama y su configuración. Los commits quedan.
recover:
  - id: recreate
    gives:
      en: The branch. Git prints its commit when it deletes it, and the first command also lists it.
      es: La rama. Git muestra su commit al borrarla, y el primer comando también lo lista.
    run:
      - git reflog
      - git branch <name> <commit>
    until:
      en: 30 days by default, if you had that branch checked out in this copy.
      es: 30 días por defecto, si tuviste esa rama activa en esta copia.
sources:
  - https://git-scm.com/docs/git-gc
checked: 2026-11-25
proof:
  lab: git
  cases:
    - shows: restored
      recipe: recreate
      setup: |
        git init -q
        echo one > a.txt; git add a.txt; git commit -qm one
        git switch -qc feature; echo two > a.txt; git commit -qam two; git switch -q main
      run: git branch -D feature
      check: test "$(git log -1 --format=%s feature)" = two
      fill: { name: feature, commit: "HEAD@{1}" }

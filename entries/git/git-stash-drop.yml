id: git-stash-drop
tool: git
example: git stash drop
title:
  en: Delete a stash
  es: Borrar un stash
match:
  - run: git stash drop
verdict: "yes"
loses:
  en: The stash leaves the list, but git keeps it for a while.
  es: El stash sale de la lista, pero git lo conserva un tiempo.
recover:
  - id: apply
    gives:
      en: The stash. Git prints its hash when it drops it. Otherwise, it is one of the commits in the first list, and its message usually starts with "WIP on".
      es: El stash. Git muestra su hash al borrarlo. Si no, es uno de los commits de la primera lista, y su mensaje suele empezar por «WIP on».
    run:
      - git fsck --unreachable --no-reflogs
      - git stash apply <hash>
    until:
      en: Until git cleans up, 2 weeks by default.
      es: Hasta que git haga limpieza, 2 semanas por defecto.
sources:
  - https://git-scm.com/docs/git-gc
checked: 2026-11-25
proof:
  lab: git
  cases:
    - shows: restored
      recipe: apply
      setup: |
        git init -q
        echo one > a.txt; git add a.txt; git commit -qm one
        echo edited > a.txt; git stash -q
      run: git stash drop
      check: test "$(cat a.txt)" = edited || test -n "$(git stash list)"
      fill:
        hash: $(git fsck --unreachable --no-reflogs 2>/dev/null | awk '/ commit /{print $3}' | xargs -n 1 git log -1 --format='%H %s' | awk '/ WIP on /{print $1}')

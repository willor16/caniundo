id: docker-rm
tool: docker
example: docker rm -f db
title:
  en: Delete a container
  es: Borrar un contenedor
match:
  - run: [docker rm, docker container rm, docker container remove, docker container prune, podman rm, podman container rm, podman container prune, docker compose rm]
verdict: "no"
loses:
  en: What the container wrote outside its volumes. With -v, also its anonymous volumes.
  es: Lo que el contenedor escribió fuera de sus volúmenes. Con -v, también sus volúmenes anónimos.
instead:
  note:
    en: Stop it, which keeps everything.
    es: Detenlo, que conserva todo.
  run: [docker stop <container>]
  back: [docker start <container>]
sources:
  - https://docs.docker.com/reference/cli/docker/container/rm/
  - https://docs.docker.com/engine/storage/
checked: 2026-11-25
proof:
  lab: docker
  cases:
    - shows: instead
      setup: docker rm -f caniundo-a >/dev/null 2>&1 || true; docker run --detach --init --name caniundo-a busybox:1.37 sleep 300; docker exec caniundo-a sh -c 'echo one > /a.txt'
      run: docker rm -f caniundo-a
      check: docker exec caniundo-a cat /a.txt | grep -q one
      fill: { container: caniundo-a }
    - shows: lost
      setup: docker rm -f caniundo-b >/dev/null 2>&1 || true; docker run --detach --name caniundo-b busybox:1.37 sleep 300; docker exec caniundo-b sh -c 'echo one > /a.txt'
      run: docker rm -f caniundo-b; docker run --detach --name caniundo-b busybox:1.37 sleep 300
      check: docker exec caniundo-b cat /a.txt | grep -q one

id: sqlite-drop-table
tool: sqlite
example: sqlite3 app.db "DROP TABLE users"
title:
  en: Delete a table in SQLite
  es: Borrar una tabla en SQLite
match:
  - sql: DROP TABLE
    dialects: [sqlite]
verdict: "no"
loses:
  en: The table, with its rows, indexes and triggers.
  es: La tabla, con sus filas, índices y disparadores.
before:
  note:
    en: Close the programs that use the database and copy the file.
    es: Cierra los programas que usan la base y copia el archivo.
  run: [cp <database> <copy>]
  back: [cp <copy> <database>]
sources:
  - https://sqlite.org/lang_droptable.html
checked: 2026-11-25
proof:
  lab: sqlite
  cases:
    - shows: before
      setup: sqlite3 app.db "create table users(n)"; sqlite3 app.db "insert into users values (1)"
      run: sqlite3 app.db "DROP TABLE users"
      check: sqlite3 app.db "select n from users" | grep -q 1
      fill: { database: app.db, copy: app.bak }
    - shows: lost
      setup: sqlite3 app.db "create table users(n)"; sqlite3 app.db "insert into users values (1)"
      run: sqlite3 app.db "DROP TABLE users"
      check: sqlite3 app.db "select n from users" | grep -q 1

id: rm-pycache
tool: files
example: rm -rf __pycache__
title:
  en: Delete Python's compiled files
  es: Borrar los archivos compilados de Python
match:
  - run: rm
    operands: { every: ["__pycache__", "*/__pycache__", "*.pyc", .pytest_cache, "*/.pytest_cache", .mypy_cache, "*/.mypy_cache", .ruff_cache, "*/.ruff_cache"] }
overrides: [rm]
verdict: "yes"
loses:
  en: Nothing. Python writes them again.
  es: Nada. Python los vuelve a escribir.
recover:
  - id: automatic
    gives:
      en: They come back on their own the next time the program runs.
      es: Vuelven solos la próxima vez que se ejecute el programa.
    run: []
sources:
  - https://docs.python.org/3/tutorial/modules.html#compiled-python-files
  - https://docs.pytest.org/en/stable/how-to/cache.html
checked: 2026-11-25

id: aws-secret-delete
tool: aws
example: aws secretsmanager delete-secret --secret-id shop-key
title:
  en: Delete a secret
  es: Borrar un secreto
match:
  - run: aws secretsmanager delete-secret
    without: [--force-delete-without-recovery]
verdict: "yes"
interrupt: true
loses:
  en: Access to the secret, right away. Programs that need it stop working.
  es: El acceso al secreto, de inmediato. Los programas que lo necesitan dejan de funcionar.
recover:
  - id: restore
    gives:
      en: The secret.
      es: El secreto.
    run: [aws secretsmanager restore-secret --secret-id <secret>]
    until:
      en: Until the waiting period ends, from 7 to 30 days.
      es: Hasta que termine el plazo, de 7 a 30 días.
sources:
  - https://docs.aws.amazon.com/cli/latest/reference/secretsmanager/delete-secret.html
  - https://docs.aws.amazon.com/cli/latest/reference/secretsmanager/restore-secret.html
checked: 2026-11-25

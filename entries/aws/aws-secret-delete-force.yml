id: aws-secret-delete-force
tool: aws
example: aws secretsmanager delete-secret --secret-id shop-key --force-delete-without-recovery
title:
  en: Delete a secret right now
  es: Borrar un secreto de inmediato
match:
  - run: aws secretsmanager delete-secret
    with: [--force-delete-without-recovery]
verdict: "no"
loses:
  en: The secret, forever.
  es: El secreto, para siempre.
instead:
  note:
    en: Without --force-delete-without-recovery there are at least 7 days to change your mind.
    es: Sin --force-delete-without-recovery hay al menos 7 días para arrepentirse.
sources:
  - https://docs.aws.amazon.com/cli/latest/reference/secretsmanager/delete-secret.html
checked: 2026-11-25

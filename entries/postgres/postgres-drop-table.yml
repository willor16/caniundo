id: postgres-drop-table
tool: postgres
example: psql -c "DROP TABLE users"
title:
  en: Delete a table in PostgreSQL
  es: Borrar una tabla en PostgreSQL
match:
  - sql: DROP TABLE
    dialects: [postgres]
verdict: "no"
loses:
  en: The table and its rows. With CASCADE, also the views and keys that depend on it.
  es: La tabla y sus filas. Con CASCADE, también las vistas y claves que dependen de ella.
instead:
  note:
    en: Try it in a transaction that ends in ROLLBACK. To keep a copy, use pg_dump --table first.
    es: Pruébalo en una transacción que termine en ROLLBACK. Para guardar una copia, usa antes pg_dump --table.
  run: ['psql -c "BEGIN; DROP TABLE <table>; ROLLBACK"']
  back: []
proof:
  lab: postgres
  cases:
    - shows: instead
      setup: psql -c "create table users(n int)" -c "insert into users values (1)"
      run: psql -c "DROP TABLE users"
      check: test "$(psql -At -c "select n from users")" = 1
      fill: { table: users }
    - shows: lost
      setup: psql -c "create table users(n int)" -c "insert into users values (1)"
      run: psql -c "DROP TABLE users"
      check: test "$(psql -At -c "select n from users")" = 1

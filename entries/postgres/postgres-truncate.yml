id: postgres-truncate
tool: postgres
example: psql -c "TRUNCATE users"
title:
  en: Empty a table in PostgreSQL
  es: Vaciar una tabla en PostgreSQL
match:
  - sql: TRUNCATE
    dialects: [postgres]
verdict: "no"
loses:
  en: Every row. With CASCADE, also the rows of the tables that refer to it.
  es: Todas las filas. Con CASCADE, también las de las tablas que la referencian.
instead:
  note:
    en: Try it in a transaction that ends in ROLLBACK. To keep a copy, use pg_dump --table first.
    es: Pruébalo en una transacción que termine en ROLLBACK. Para guardar una copia, usa antes pg_dump --table.
  run: ['psql -c "BEGIN; TRUNCATE <table>; ROLLBACK"']
  back: []
sources:
  - https://www.postgresql.org/docs/current/sql-truncate.html
checked: 2026-11-25
proof:
  lab: postgres
  cases:
    - shows: instead
      setup: psql -c "create table users(n int)" -c "insert into users values (1)"
      run: psql -c "TRUNCATE users"
      check: test "$(psql -At -c "select n from users")" = 1
      fill: { table: users }
    - shows: lost
      setup: psql -c "create table users(n int)" -c "insert into users values (1)"
      run: psql -c "TRUNCATE users"
      check: test "$(psql -At -c "select n from users")" = 1

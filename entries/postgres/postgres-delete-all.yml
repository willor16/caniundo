id: postgres-delete-all
tool: postgres
example: psql -c "DELETE FROM users"
title:
  en: Delete every row of a table in PostgreSQL
  es: Borrar todas las filas de una tabla en PostgreSQL
match:
  - sql: DELETE FROM
    dialects: [postgres]
    everyRow: true
verdict: "no"
loses:
  en: Every row, because there is no WHERE.
  es: Todas las filas, porque no hay WHERE.
instead:
  note:
    en: Try it in a transaction that ends in ROLLBACK. To keep a copy, use pg_dump --table first.
    es: Pruébalo en una transacción que termine en ROLLBACK. Para guardar una copia, usa antes pg_dump --table.
  run: ['psql -c "BEGIN; DELETE FROM <table>; ROLLBACK"']
  back: []
proof:
  lab: postgres
  cases:
    - shows: instead
      setup: psql -c "create table users(n int)" -c "insert into users values (1)"
      run: psql -c "DELETE FROM users"
      check: test "$(psql -At -c "select n from users")" = 1
      fill: { table: users }
    - shows: lost
      setup: psql -c "create table users(n int)" -c "insert into users values (1)"
      run: psql -c "DELETE FROM users"
      check: test "$(psql -At -c "select n from users")" = 1
